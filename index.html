<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gruffalo Audiobook</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            text-align: center; 
            background-color: #0d1a0d; 
            color: #d4af37;
            padding: 20px;
        }
        .audio-card {
            max-width: 450px;
            margin: 20px auto;
            background: #1e331e;
            padding: 25px;
            border-radius: 40px;
            border: 10px solid #5d3a1a;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }
        img { 
            width: 100%; 
            border-radius: 20px; 
            margin-bottom: 25px;
            border: 4px solid #d4af37;
        }
        .play-btn { 
            background-color: #c0392b; 
            border: none; 
            color: white; 
            padding: 30px 60px;
            font-size: 30px; 
            border-radius: 60px; 
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px #7b1e15;
            transition: 0.2s;
        }
        .play-btn:active { 
            box-shadow: 0 3px #7b1e15; 
            transform: translateY(5px); 
        }
        #timer { margin-top: 20px; font-size: 20px; color: #fff; }
    </style>
</head>
<body>

    <div class="audio-card">
        <h1>Full Audiobook</h1>
        <img src="gruffalo-cover.jpg" alt="The Gruffalo and the Mouse">
        
        <button class="play-btn" id="audioBtn" onclick="controlAudio()">🎧 PLAY STORY</button>
        <div id="timer">Tap to start the adventure!</div>
        
        <audio id="gruffaloStory" src="gruffalo.mp3"></audio>
    </div>

    <script>
        const audio = document.getElementById('gruffaloStory');
        const btn = document.getElementById('audioBtn');
        const timer = document.getElementById('timer');

        function controlAudio() {
            if (audio.paused) {
                audio.play();
                btn.innerText = "⏸ PAUSE";
                timer.innerText = "Listening to the deep dark wood...";
            } else {
                audio.pause();
                btn.innerText = "▶ RESUME";
                timer.innerText = "Story paused.";
            }
        }

        // Keep the timer updated so he knows it's still playing
        audio.ontimeupdate = function() {
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            timer.innerText = "Time: " + mins + ":" + (secs < 10 ? '0' : '') + secs;
        };

        audio.onended = function() {
            btn.innerText = "▶ PLAY AGAIN";
            timer.innerText = "The End. Nut was good!";
        };
    </script>
</body>
</html>
